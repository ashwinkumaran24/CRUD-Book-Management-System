
<!DOCTYPE html>
<html>
<head>
    <title>Book Management System</title>
</head>
<body>
    <h1>Book Management System</h1>

    <a href="{% url 'book_create' %}">Add Book</a>

    <table border="1">
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>
                <a href="{% url 'book_update' book.id %}">Update Price</a>

                <form method="POST"
                      action="{% url 'book_delete' book.id %}"
                      style="display:inline;">
                    {% csrf_token %}
                    <button type="submit"
                            onclick="return confirm('Delete this book?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No books available.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
