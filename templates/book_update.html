
<!DOCTYPE html>
<html>
<head>
    <title>Update Book Price</title>
</head>
<body>
    <h1>Update Book Price</h1>

    <p>Book: {{ book.title }}</p>
    <p>Author: {{ book.author }}</p>

    <form method="POST">
        {% csrf_token %}

        <label>Price:</label>
        <input type="number" name="price"
               value="{{ book.price }}" required>

        <button type="submit">Update</button>
    </form>

    <a href="/">Back to Book List</a>
</body>
</html>
