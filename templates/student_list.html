
<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
</head>
<body>
    <h1>Student Management System</h1>

    <!-- Step 4: Add this link below the heading -->
    <a href="{% url 'student_create' %}">Add Student</a>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.department }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No students found</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
